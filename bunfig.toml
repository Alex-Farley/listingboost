[test]
preload = ["./tests/support/preload.ts"]
# The per-test limit is set with --timeout 30000 in the package.json test scripts. Bun 1.3 ignores
# a `timeout` key here and silently used its 5 s default, which killed UI tests on busy CI runners
# (work item 005). It must stay well above Testing Library's 5 s async wait (tests/ui/harness.tsx),
# so a slow query fails with its own message; tests/unit/test-config.test.ts checks both.
