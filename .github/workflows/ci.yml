name: ListingBoost CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: listingboost-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Adaptation checks
        run: bun run check:adapted

      - name: Tests
        run: bun test tests/*.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
