name: ListingBoost merge lifecycle

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close explicitly linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          linked_issues="$(
            printf '%s\n' "$PR_BODY" |
              grep -Eio '(closes|closed|fixes|fixed|resolves|resolved)[[:space:]]+#[0-9]+' |
              grep -Eo '#[0-9]+' |
              tr -d '#' |
              sort -nu || true
          )"

          while read -r issue_number; do
            [ -n "$issue_number" ] || continue
            gh api --method PATCH -H "Accept: application/vnd.github+json" \
              "/repos/$REPOSITORY/issues/$issue_number" \
              -f state=closed -f state_reason=completed
            gh api --method POST -H "Accept: application/vnd.github+json" \
              "/repos/$REPOSITORY/issues/$issue_number/comments" \
              -f body="Completed by merged PR #$PR_NUMBER."
          done <<< "$linked_issues"
