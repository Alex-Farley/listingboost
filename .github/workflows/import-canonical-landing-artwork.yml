name: Import canonical landing artwork

on:
  push:
    branches: [fix/canonical-example-campaign-artwork]
    paths:
      - ".github/workflows/import-canonical-landing-artwork.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download canonical artwork
        run: |
          set -euo pipefail
          mkdir -p public/assets/landing
          curl -fL --retry 3 -o public/assets/landing/listingboost-example-campaign.jpg 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JV2k35Yl2Vz0UMWDW5zZDAST67/6f8b0bf0-ab68-450e-82ba-c0a72b44bf01.jpg'
          curl -fL --retry 3 -o public/assets/landing/listingboost-campaign-types.jpg 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JV2k35Yl2Vz0UMWDW5zZDAST67/e219dad8-3fd5-4b00-b975-2eb761d4dcc5.jpg'
          curl -fL --retry 3 -o public/assets/landing/listingboost-showcase-practice.jpg 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JV2k35Yl2Vz0UMWDW5zZDAST67/900e7353-723e-4aca-badf-63b2c68b2eec.jpg'
          curl -fL --retry 3 -o public/assets/landing/listingboost-showcase-detail.jpg 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JV2k35Yl2Vz0UMWDW5zZDAST67/fe7257d6-1d93-47e2-a4ad-96f4bb1fb879.jpg'
          file public/assets/landing/listingboost-*.jpg
          sha256sum public/assets/landing/listingboost-*.jpg

      - name: Commit artwork
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/landing/listingboost-example-campaign.jpg public/assets/landing/listingboost-campaign-types.jpg public/assets/landing/listingboost-showcase-practice.jpg public/assets/landing/listingboost-showcase-detail.jpg
          git commit -m "assets: import canonical ListingBoost landing artwork"
          git push
