name: ListingBoost standalone Cloudflare deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview

permissions:
  contents: read

concurrency:
  group: listingboost-standalone-${{ github.event_name == 'push' && 'preview' || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy standalone ListingBoost
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: listingboost-${{ github.event_name == 'push' && 'preview' || inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun ci

      - name: Verify source
        run: |
          bun run test
          bun run typecheck
          bun run lint
          bun run check:provider-boundary
          bun run check:infra-boundary
          bun run build
          bun run verify:build
          grep -q "Turn one listing into everything you need to market it." dist/server/server.js
          grep -q "Illustrative campaign mockup" dist/server/server.js
          echo "Verified preview build contains the current editorial ListingBoost landing content."

      - name: Validate deployment resource isolation
        env:
          LB_WORKER_NAME: ${{ vars.LB_WORKER_NAME }}
          LB_D1_DATABASE_ID: ${{ vars.LB_D1_DATABASE_ID }}
          LB_D1_DATABASE_NAME: ${{ vars.LB_D1_DATABASE_NAME }}
          LB_R2_BUCKET_NAME: ${{ vars.LB_R2_BUCKET_NAME }}
          LB_QUEUE_NAME: ${{ vars.LB_QUEUE_NAME }}
          LB_BETTER_AUTH_URL: ${{ vars.LB_BETTER_AUTH_URL }}
          LB_ROUTE: ${{ vars.LB_ROUTE }}
          LB_ENVIRONMENT: ${{ github.event_name == 'push' && 'preview' || inputs.environment }}
        run: node scripts/validate-standalone-deployment.mjs

      - name: Generate environment-specific Wrangler config
        env:
          LB_WORKER_NAME: ${{ vars.LB_WORKER_NAME }}
          LB_D1_DATABASE_ID: ${{ vars.LB_D1_DATABASE_ID }}
          LB_D1_DATABASE_NAME: ${{ vars.LB_D1_DATABASE_NAME }}
          LB_R2_BUCKET_NAME: ${{ vars.LB_R2_BUCKET_NAME }}
          LB_QUEUE_NAME: ${{ vars.LB_QUEUE_NAME }}
          LB_BETTER_AUTH_URL: ${{ vars.LB_BETTER_AUTH_URL }}
          LB_ROUTE: ${{ vars.LB_ROUTE }}
          LB_ZONE_NAME: ${{ vars.LB_ZONE_NAME }}
          LB_ENVIRONMENT: ${{ github.event_name == 'push' && 'preview' || inputs.environment }}
        run: node scripts/generate-standalone-wrangler.mjs "$RUNNER_TEMP/listingboost-wrangler.json"

      - name: Report deployment target
        if: ${{ github.event_name == 'push' || inputs.environment == 'preview' }}
        env:
          LB_WORKER_NAME: ${{ vars.LB_WORKER_NAME }}
          LB_BETTER_AUTH_URL: ${{ vars.LB_BETTER_AUTH_URL }}
          LB_ROUTE: ${{ vars.LB_ROUTE }}
          LB_ZONE_NAME: ${{ vars.LB_ZONE_NAME }}
        run: |
          echo "Preview worker: $LB_WORKER_NAME"
          echo "Preview URL: $LB_BETTER_AUTH_URL"
          echo "Configured route: ${LB_ROUTE:-<none>}"
          echo "Configured zone: ${LB_ZONE_NAME:-<none>}"

      - name: Ensure preview R2 bucket exists
        if: ${{ (github.event_name == 'push' || inputs.environment == 'preview') && vars.LB_R2_BUCKET_NAME != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LB_R2_BUCKET_NAME: ${{ vars.LB_R2_BUCKET_NAME }}
        run: |
          if bunx wrangler r2 bucket info "$LB_R2_BUCKET_NAME" --json > "$RUNNER_TEMP/r2-bucket.json"; then
            echo "Preview R2 bucket already exists: $LB_R2_BUCKET_NAME"
          else
            echo "Creating missing preview R2 bucket: $LB_R2_BUCKET_NAME"
            bunx wrangler r2 bucket create "$LB_R2_BUCKET_NAME"
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config "${{ runner.temp }}/listingboost-wrangler.json"

      - name: Smoke test deployed preview
        if: ${{ github.event_name == 'push' || inputs.environment == 'preview' }}
        env:
          LB_BETTER_AUTH_URL: ${{ vars.LB_BETTER_AUTH_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            -D "$RUNNER_TEMP/preview.headers" \
            -o "$RUNNER_TEMP/preview.html" \
            "$LB_BETTER_AUTH_URL/"
          echo "Deployed preview response:"
          grep -iE '^(x-listingboost-source|cache-control):' "$RUNNER_TEMP/preview.headers" || true
          grep -q "main-3869ce27-editorial-preview" "$RUNNER_TEMP/preview.headers"
          grep -q "Turn one listing into everything you need to market it." "$RUNNER_TEMP/preview.html"
          echo "Preview runtime is serving the current editorial build."

      - name: Report deployment boundary
        run: |
          echo "Standalone deployment completed for ${{ github.event_name == 'push' && 'preview' || inputs.environment }}."
          echo "Production remains a manually triggered deployment until domain, secrets and resource bindings are verified."
